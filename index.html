 clearTimeout(SWM.tm);SWM.tm=setTimeout(()=>{if(SWM.wait&&!SWM.on){swimCancel();closePanel();toast('לא נמצא יריב כרגע');}},90000);}

 if(SWM.phase==='out'||SWM.phase==='back'){const el=(performance.now()-SWM.t0)/1000;
  swimHud('⏱ '+el.toFixed(1)+(SWM.phase==='out'?' – שחו לקצה השני ➡️':' – ועכשיו חזרה! ⬅️'));
  if(SWM.phase==='out'&&P.x>=SWX1)SWM.phase='back';

 const N=700,cv=document.createElement('canvas');cv.width=N;cv.height=N;cv.style.cssText='width:100%;border-radius:12px;display:block;background:#4a7a45;touch-action:manipulation';

  const pp=place==='out'?W(P.x,P.z):W(lastOut.x,lastOut.z);g.fillStyle='#ff3030';g.strokeStyle='#fff';g.lineWidth=3;g.save();g.translate(pp[0],pp[1]);g.rotate(-P.ry+Math.PI);g.beginPath();g.moveTo(0,-11);g.lineTo(8,9);g.lineTo(-8,9);g.closePath();g.fill();g.stroke();g.restore();}
 const info=h('div',{style:'margin:8px 0;min-height:22px;font-size:15px;text-align:center'},['לחץ על מקום במפה 👆']);
